[package]
name = "tree-sitter-oracle-plsql"
description = "Tree-Sitter grammar for Oracle PLSQL"
version = "0.1.0"
authors = ["Hrushikesh Pawar"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "oracle-plsql"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/hrushikeshpawar/tree-sitter-oracle_plsql"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.11"
